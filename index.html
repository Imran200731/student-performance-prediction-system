<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="AI-powered student performance prediction system"
    >

    <title>Student Performance Predictor | AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>

    <main class="container">

        <!-- HERO SECTION -->
        <header class="hero">

            <div class="badge">
                🤖 AI POWERED
            </div>

            <h1>
                Student Performance
                <br>
                <span>Predictor</span>
            </h1>

            <p>
                Predict academic performance using study habits,
                attendance and assessment data.
            </p>

        </header>


        <!-- INPUT CARD -->
        <section class="card">

            <div class="card-header">

                <div>
                    <h2>Student Information</h2>

                    <p>
                        Enter the student's academic details
                    </p>
                </div>

                <div class="icon">
                    🎓
                </div>

            </div>


            <div class="form-grid">

                <!-- STUDY HOURS -->
                <div class="input-group">

                    <label for="studyHours">
                        📚 Study Hours / Day
                    </label>

                    <input
                        type="number"
                        id="studyHours"
                        min="0"
                        max="24"
                        step="0.5"
                        placeholder="e.g. 5"
                    >

                </div>


                <!-- ATTENDANCE -->
                <div class="input-group">

                    <label for="attendance">
                        📊 Attendance (%)
                    </label>

                    <input
                        type="number"
                        id="attendance"
                        min="0"
                        max="100"
                        placeholder="e.g. 85"
                    >

                </div>


                <!-- PREVIOUS SCORE -->
                <div class="input-group">

                    <label for="previousScore">
                        📝 Previous Score (%)
                    </label>

                    <input
                        type="number"
                        id="previousScore"
                        min="0"
                        max="100"
                        placeholder="e.g. 78"
                    >

                </div>


                <!-- ASSIGNMENT SCORE -->
                <div class="input-group">

                    <label for="assignmentScore">
                        📋 Assignment Score (%)
                    </label>

                    <input
                        type="number"
                        id="assignmentScore"
                        min="0"
                        max="100"
                        placeholder="e.g. 82"
                    >

                </div>


                <!-- INTERNAL SCORE -->
                <div class="input-group">

                    <label for="internalScore">
                        🧪 Internal Exam (%)
                    </label>

                    <input
                        type="number"
                        id="internalScore"
                        min="0"
                        max="100"
                        placeholder="e.g. 75"
                    >

                </div>


                <!-- SLEEP HOURS -->
                <div class="input-group">

                    <label for="sleepHours">
                        😴 Sleep Hours / Day
                    </label>

                    <input
                        type="number"
                        id="sleepHours"
                        min="0"
                        max="24"
                        step="0.5"
                        placeholder="e.g. 7"
                    >

                </div>

            </div>


            <!-- PREDICT BUTTON -->
            <button
                id="predictBtn"
                type="button"
                onclick="predictPerformance()"
            >

                <span>
                    Predict Performance
                </span>

                <span>
                    →
                </span>

            </button>

        </section>


        <!-- RESULT SECTION -->
        <section
            id="result"
            class="result-card hidden"
        >

            <div class="result-icon">
                🎯
            </div>

            <p class="result-label">
                PREDICTED PERFORMANCE
            </p>

            <h2 id="prediction">
                —
            </h2>


            <!-- SCORE -->
            <div class="score-container">

                <div class="score-bar">

                    <div id="scoreFill"></div>

                </div>

                <span id="score">
                    0%
                </span>

            </div>


            <p id="message"></p>

        </section>


        <!-- FOOTER -->
        <footer>

            <p>
                Student Performance Prediction System
                • Machine Learning Project
            </p>

        </footer>

    </main>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
